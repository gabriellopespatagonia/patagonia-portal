# Publica o site no Azure Static Web Apps a cada envio (push) para a branch main.
# Requer o segredo AZURE_STATIC_WEB_APPS_API_TOKEN no repositório
# (Settings → Secrets and variables → Actions), com o token de implantação do Azure.
name: Publicar no Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar site e API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "/"
          api_location: "api"
          output_location: ""
          skip_app_build: true
